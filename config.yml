# ============================================================================
#  ChessSMP 2.2.0 - configuration
#  Messages use MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#  Run /chess reload after editing. Missing keys fall back to the built-in defaults.
# ============================================================================

default-piece: PAWN        # piece every new player starts with

storage:
  autosave-minutes: 5

stats:
  public-lookup: true      # may everybody use /chess stats <player>?

# ------------------------------------------------------------------ choosing pieces
choose:
  enabled: true
  allowed-during-event: false   # during Chess War pieces can only be changed with the Piece Trader
  cooldown-seconds: 300         # between free /chess choose changes (first choice is free)
  blocked-in-combat: true
  switch-lockout-seconds: 20    # abilities of a freshly chosen piece start with at least this cooldown

# ------------------------------------------------------------------ combat
combat:
  tag-seconds: 20
  punish-logout: false          # kill players who log out while combat tagged

# ------------------------------------------------------------------ ability rules
abilities:
  allow-concurrent: false       # false = only one timed ability active at a time (prevents stacking)
  ready-notification: true
  announce-radius: 24           # nearby players see "X used Y" (0 = off)
  support-non-event-players: true   # outside events support abilities also help players you are not fighting

ability-items:                  # optional keybind-style items: /chess wand
  enabled: true
  material: BLAZE_ROD
  name: "<gold><bold>Chess Scepter"
  lore:
    - "<gray>Right-click: <white>Ability 1"
    - "<gray>Sneak + right-click: <white>Ability 2"
    - "<gray>Swap hands (F): <white>Ability 3"

particles:
  enabled: true
  default-ability: end_rod
  piece-change: totem_of_undying
sounds:
  enabled: true
  piece-change: item.armor.equip_iron

# ------------------------------------------------------------------ name tags
nametag:
  enabled: true
  prefix-format: "<emoji> "          # shown in front of the name above the head
  tab-format: "<emoji> <name>"       # tab list
  override-foreign-teams: false      # true = replace scoreboard teams of other plugins

# ------------------------------------------------------------------ the six pieces
classes:
  pawn:
    display-name: Pawn
    emoji: "♟"
    color: GRAY
    icon: IRON_NUGGET
    role: Balanced fighter
    playstyle: Reliable all-rounder that grows stronger when it matters.
    stats: {offense: 5, defense: 5, mobility: 6, support: 3}
    abilities:
      1:
        name: Forward March
        description: Gain Speed II for a short time.
        icon: SUGAR
        cooldown: 40
        duration: 8
        speed-level: 2
        particle: cloud
        sound: entity.horse.gallop
      2:
        name: Second Wind
        description: Instantly regenerate a portion of your missing health.
        icon: GLISTERING_MELON_SLICE
        cooldown: 60
        duration: 0
        heal-missing-fraction: 0.4
        particle: heart
        sound: entity.player.breath
      3:
        name: Promotion
        description: Temporarily improve your combat statistics (Strength + Resistance).
        icon: GOLD_NUGGET
        cooldown: 90
        duration: 10
        strength-level: 1
        resistance-level: 1
        particle: totem_of_undying
        sound: item.totem.use
  knight:
    display-name: Knight
    emoji: "♞"
    color: AQUA
    icon: IRON_HORSE_ARMOR
    role: Mobility and aggressive combat
    playstyle: Hit hard, jump in and out of fights.
    stats: {offense: 7, defense: 4, mobility: 10, support: 3}
    abilities:
      1:
        name: L-Jump
        description: Perform a powerful forward leap (no fall damage for a few seconds).
        icon: RABBIT_FOOT
        cooldown: 45
        duration: 0
        forward-strength: 1.6
        vertical-strength: 0.7
        fall-protection: 5
        particle: cloud
        sound: entity.horse.jump
      2:
        name: Knight's Charge
        description: Gain temporary speed, strength and jump height.
        icon: IRON_SWORD
        cooldown: 60
        duration: 8
        speed-level: 2
        strength-level: 1
        jump-level: 2
        particle: crit
        sound: entity.horse.angry
      3:
        name: Evasion
        description: Briefly gain a burst of movement speed.
        icon: FEATHER
        cooldown: 40
        duration: 5
        speed-level: 3
        particle: cloud
        sound: entity.phantom.flap
  bishop:
    display-name: Bishop
    emoji: "♝"
    color: LIGHT_PURPLE
    icon: AMETHYST_SHARD
    role: Support and defensive magic
    playstyle: Keep your team alive with wards, healing and cleansing.
    stats: {offense: 4, defense: 7, mobility: 5, support: 9}
    abilities:
      1:
        name: Diagonal Ward
        description: Temporary protection (Resistance + a small absorption shield).
        icon: SHIELD
        cooldown: 45
        duration: 8
        resistance-level: 1
        absorption-level: 1
        particle: enchant
        sound: block.beacon.activate
      2:
        name: Sanctuary
        description: Instantly restore health of nearby teammates (and yourself).
        icon: GLOWSTONE_DUST
        cooldown: 50
        duration: 0
        radius: 8
        heal: 6
        include-self: true
        particle: heart
        sound: block.respawn_anchor.charge
      3:
        name: Holy Light
        description: Regeneration for nearby teammates and a cleanse of harmful effects.
        icon: GHAST_TEAR
        cooldown: 70
        duration: 8
        radius: 8
        regeneration-level: 2
        cleanse: true
        include-self: true
        particle: end_rod
        sound: block.amethyst_block.chime
  rook:
    display-name: Rook
    emoji: "♜"
    color: DARK_GRAY
    icon: STONE_BRICKS
    role: Tank and battlefield control
    playstyle: Hold the line. Slow, but nearly unbreakable.
    stats: {offense: 5, defense: 10, mobility: 2, support: 4}
    abilities:
      1:
        name: Castle
        description: Gain strong resistance (but you are slowed while it lasts).
        icon: BRICKS
        cooldown: 60
        duration: 6
        resistance-level: 2
        slowness-level: 1
        particle: block_marker
        sound: block.anvil.land
      2:
        name: Iron Resolve
        description: Gain temporary absorption hearts.
        icon: IRON_INGOT
        cooldown: 70
        duration: 15
        absorption-level: 3
        particle: crit
        sound: item.armor.equip_iron
      3:
        name: Fortress
        description: Reduce all incoming damage for a short duration.
        icon: IRON_BARS
        cooldown: 80
        duration: 8
        damage-reduction: 0.4
        particle: smoke
        sound: block.iron_door.close
  queen:
    display-name: Queen
    emoji: "♛"
    color: GOLD
    icon: NETHER_STAR
    role: High-damage versatile fighter
    playstyle: Dominate duels, weaken enemies, trade defense for power.
    stats: {offense: 10, defense: 5, mobility: 7, support: 6}
    abilities:
      1:
        name: Royal Tempo
        description: Temporary Strength and Speed.
        icon: BLAZE_POWDER
        cooldown: 60
        duration: 8
        strength-level: 1
        speed-level: 2
        particle: flame
        sound: entity.blaze.shoot
      2:
        name: Royal Decree
        description: Weaken and slow nearby enemies (needs an enemy in range).
        icon: WITHER_ROSE
        cooldown: 70
        duration: 6
        radius: 8
        weakness-level: 1
        slowness-level: 1
        particle: smoke
        sound: entity.evoker.cast_spell
      3:
        name: Queen's Gambit
        description: Gain strong offense but take extra damage.
        icon: FIRE_CHARGE
        cooldown: 90
        duration: 8
        strength-level: 2
        damage-taken-increase: 0.3
        particle: flame
        sound: entity.ender_dragon.growl
  king:
    display-name: King
    emoji: "♚"
    color: YELLOW
    icon: GOLDEN_HELMET
    role: Leadership and team protection
    playstyle: Protect the crown and empower your allies.
    stats: {offense: 6, defense: 9, mobility: 3, support: 10}
    abilities:
      1:
        name: Royal Guard
        description: Temporary protection (Resistance, absorption and reduced damage).
        icon: GOLDEN_CHESTPLATE
        cooldown: 70
        duration: 10
        resistance-level: 1
        absorption-level: 2
        damage-reduction: 0.2
        particle: end_rod
        sound: item.armor.equip_gold
      2:
        name: King's Rally
        description: Give nearby teammates temporary Strength, Speed and Resistance.
        icon: BELL
        cooldown: 80
        duration: 10
        radius: 10
        strength-level: 1
        speed-level: 1
        resistance-level: 1
        include-self: true
        require-ally: true
        particle: happy_villager
        sound: block.bell.use
      3:
        name: Last Stand
        description: Only usable when low on health - become much stronger for a while.
        icon: TOTEM_OF_UNDYING
        cooldown: 120
        duration: 8
        health-threshold: 0.4
        strength-level: 2
        resistance-level: 1
        regeneration-level: 1
        particle: totem_of_undying
        sound: item.totem.use

# ------------------------------------------------------------------ Chess War event
event:
  join-period-seconds: 60
  min-players: 2
  score-limit: 15              # first team to this many points wins
  time-limit-minutes: 20       # when time runs out the higher score wins
  auto-join-all: false
  allow-late-join: true
  balance-mode: STRENGTH       # STRENGTH (balances count and piece strength) or RANDOM
  countdown-marks: [60, 30, 10, 5, 4, 3, 2, 1]
  time-warnings: [300, 60, 30, 10]
  points:
    kill: 1
    king-kill-bonus: 2
  respawn:
    mode: INSTANT              # INSTANT, DELAYED (spectate for delay-seconds) or ELIMINATION (out until the end)
    delay-seconds: 8
  disconnect-grace-seconds: 120
  remove-on-disconnect: false
  sidebar: true
  final-sidebar-seconds: 15
  final-board-players: 5
  teams:
    white: {name: White, color: WHITE}
    black: {name: Black, color: DARK_GRAY}
  rewards:                      # chess-points, items (MATERIAL:amount) and console commands (%player%)
    participants:
      chess-points: 10
    winners:
      chess-points: 50
      items: ["DIAMOND:3"]
      commands: []
    losers:
      chess-points: 0

# The winner (MVP = most kills on the winning team) receives the Grandmaster Mace.
grandmaster-mace:
  recipient: MVP               # MVP, ALL_WINNERS or NONE
  name: "<gradient:#ffd700:#ff8c00><bold>♚ Grandmaster Mace"
  model: "chesssmp:grandmaster_mace"
  unbreakable: true
  dash-strength: 1.9
  dash-min-vertical: 0.2
  dash-cooldown-seconds: 6
  lore:
    - "<gray>Awarded to the winner of a Chess War."
    - ""
    - "<gold>Right-click <gray>while holding: <white>dash forward"

# ------------------------------------------------------------------ Piece Trader
trader:
  material: EMERALD
  display-name: "<green>♟ Piece Trader"
  lore:
    - "<gray>Right-click to open the trading menu."
    - "<gray>Change your chess piece, buy combat gear,"
    - "<gray>consumables and tactical items."
    - ""
    - "<dark_gray>Bound to its owner."
  bind-to-owner: true
  allow-drop: false
  confirm-threshold: 10        # trades costing at least this many items ask for confirmation
  change-piece:
    cost: ["DIAMOND:6", "GOLD_INGOT:8"]
  offers:
    ender_pearls:
      material: ENDER_PEARL
      amount: 1
      category: Tactical
      cost: ["EMERALD:4"]
    golden_apple:
      material: GOLDEN_APPLE
      amount: 1
      category: Consumable
      cost: ["GOLD_INGOT:6"]
    shield:
      material: SHIELD
      amount: 1
      category: Combat equipment
      cost: ["IRON_INGOT:8"]
    wind_charges:
      material: WIND_CHARGE
      amount: 4
      category: Tactical
      cost: ["EMERALD:5"]
    experience_bottles:
      material: EXPERIENCE_BOTTLE
      amount: 16
      category: Consumable
      cost: ["GOLD_INGOT:4"]
    enchanted_golden_apple:
      material: ENCHANTED_GOLDEN_APPLE
      amount: 1
      category: Consumable
      cost: ["EMERALD:12"]

# ------------------------------------------------------------------ crafting restrictions
# These items can no longer be crafted - get them from the villagers' shops instead.
crafting:
  block-enabled: true
  blocked-results:
    - SHIELD
    - WIND_CHARGE
    - BREEZE_ROD
    - MACE
    - GOLDEN_APPLE
    - ENCHANTED_GOLDEN_APPLE
    - TNT
    - END_CRYSTAL
    - CROSSBOW
    - BOW
    - TOTEM_OF_UNDYING
    - ENDER_EYE

# ------------------------------------------------------------------ custom items
items:
  remnant:
    material: ECHO_SHARD
    name: "<gradient:#00ffa2:#0a6b4a><bold>Meteor Remnant"
    model: "chesssmp:remnant"
    lore:
      - "<gray>A shard of the fallen meteor."
      - "<gray>8 around a <white>Nether Star<gray> forge the"
      - "<gold>Chess Grandmaster<gray> title."
  chess-grandmaster:
    material: NAME_TAG
    name: "<gradient:#ffd700:#ff8c00><bold>♚ Chess Grandmaster"
    model: ""
    lore:
      - "<gray>Right-click to claim the title."
      - "<gray>Kill players to collect their pieces."
      - "<gray>All six pieces: freezing hit, Speed III, Resistance I."
      - "<red>Dying drops the title and resets your pieces."
  chess-clock:
    material: CLOCK
    name: "<aqua><bold>Chess Clock"
    model: ""
    lore:
      - "<gray>Right-click: everything within 20 blocks"
      - "<gray>slows to a crawl. You are not affected."
      - "<dark_gray>Cooldown: 50 seconds"

grandmaster:
  freeze-seconds: 15
  freeze-cooldown-seconds: 120
  speed-level: 3
  resistance-level: 1
  prefix-format: "<gold><bold>♚ GRANDMASTER</bold></gold> "
  tab-prefix: "<gold>♚ </gold>"

clock:
  radius: 20
  duration-seconds: 10
  cooldown-seconds: 50
  slowness-level: 6
  fatigue-level: 3
  projectile-speed-factor: 0.25

resourcepack:
  use-item-models: true     # set to false if you do not use the ChessSMP resource pack

# ------------------------------------------------------------------ meteor
meteor:
  announce: true
  crater:
    radius: 28              # very large crater
    depth: 12
  core:
    radius: 5               # medium meteor (4-8)
  blocks-per-tick: 2000
  core-remnants: 3          # remnants in the barrel inside the meteor
  villager:
    name: "<green><bold>Meteor Trader"
  auto-spawn:
    enabled: false          # true = a meteor crashes at a random place every interval
