        label: Chess Clock
        category: Tactical
        cost: ["NETHERITE_INGOT:8", "DIAMOND:16"]
      netherite_helmet:
        material: NETHERITE_HELMET
        category: Maxed gear
        enchants: [protection:4, unbreaking:3, mending:1, respiration:3, aqua_affinity:1]
        cost: ["NETHERITE_INGOT:4", "DIAMOND:8"]
      netherite_chestplate:
