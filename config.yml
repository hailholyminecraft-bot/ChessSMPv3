# ------------------------------------------------------------------ /chess announce
announce:
  default-title-color: gold
  default-subtitle-color: yellow
  stay-seconds: 5
  fade-in-ms: 500
  fade-out-ms: 1000
  sound: block.note_block.chime

# ------------------------------------------------------------------ progression
points:
  kill: 5
  king-kill-bonus: 10
  same-victim-cooldown-seconds: 300   # killing the same player again within this time gives no points

progression:               # ranks are cosmetic only (title + kill effect) - they never change combat values
  ranks:
    pawn:   {points: 0,    title: Foot Soldier, kill-effect: ""}
    knight: {points: 100,  title: Cavalier,     kill-effect: crit}
    bishop: {points: 300,  title: Oracle,       kill-effect: enchant}
    rook:   {points: 700,  title: Bulwark,      kill-effect: smoke}
    queen:  {points: 1500, title: Sovereign,    kill-effect: flame}
    king:   {points: 3000, title: Grandmaster,  kill-effect: totem_of_undying}

objectives:                # TYPE: KILLS, BEST_STREAK, EVENT_WINS, EVENTS_PLAYED, ABILITIES_USED, PIECE_CHANGES, POINTS
  first-capture:
    name: First Capture
    description: Defeat your first opponent.
    type: KILLS
    amount: 1
    reward: 10
  hunter:
    name: Hunter
    description: Defeat 25 opponents.
    type: KILLS
    amount: 25
    reward: 75
  on-a-roll:
    name: On a Roll
    description: Reach a killstreak of 5.
    type: BEST_STREAK
    amount: 5
    reward: 50
  tactician:
    name: Tactician
    description: Use 100 abilities.
    type: ABILITIES_USED
    amount: 100
    reward: 50
  veteran:
    name: War Veteran
    description: Take part in 5 Chess War events.
    type: EVENTS_PLAYED
    amount: 5
    reward: 60
  champion:
    name: Champion
    description: Win a Chess War.
    type: EVENT_WINS
    amount: 1
    reward: 100
  shapeshifter:
    name: Shapeshifter
    description: Change your piece 3 times.
    type: PIECE_CHANGES
    amount: 3
    reward: 25

killstreak:
  shutdown-min: 5
  announcements:
    3: "<gold>♞ <player> <gray>is on a <yellow><streak>-capture <gray>streak!"
    5: "<gold>♛ <player> <gray>is dominating the board - <red><streak> <gray>captures in a row!"
    10: "<dark_red>♚ <player> <gray>is unstoppable: <red><streak> <gray>captures!"

join-messages:
  enabled: true
  messages:
    - "<yellow><emoji> <player> <gray>takes a seat at the board. <dark_gray>(<rank>)"
    - "<yellow><emoji> <player> <gray>moves into position."
    - "<yellow><emoji> <player> <gray>enters the game as a <piece>."

death-messages:
  enabled: true
  pvp:
    - "<killer_piece> <killer> <gray>captured <victim_piece> <victim><gray>."
    - "<victim_piece> <victim> <gray>was taken off the board by <killer_piece> <killer><gray>."
    - "<killer> <gray>checkmated <victim><gray>!"

# ------------------------------------------------------------------ messages
messages:
  prefix: "<dark_gray>[<gold>♚<dark_gray>] <gray>"
  no-permission: "<red>You do not have permission to do that."
  player-only: "<red>Only players can use this command."
  unknown-subcommand: "<red>Unknown sub command. Use <white>/chess help<red>."
  usage: "<red>Usage: <white><usage>"
  player-not-found: "<red>Player <white><player> <red>was not found."
  reload-done: "<green>ChessSMP configuration reloaded."
  admin-done: "<green>Done."
  help-header: "<dark_gray><strikethrough>     <reset> <gold><bold>ChessSMP <reset><dark_gray><strikethrough>     "
  help-lines:
    - "<yellow>/chess choose [piece] <gray>- choose your chess piece"
    - "<yellow>/chess ability <1-3> <gray>- use an ability"
    - "<yellow>/chessinfo <gray>- your piece, stats and abilities"
    - "<yellow>/chess trader <gray>- get the Piece Trader"
    - "<yellow>/chess wand <gray>- get the Chess Scepter"
    - "<yellow>/chess top <gray>- Chess Points leaderboard"
    - "<yellow>/chess stats [player] <gray>- statistics"
    - "<yellow>/chess trust <player> <gray>- your attacks will never affect them (/chess untrust)"
    - "<yellow>/chess event <join|leave|status> <gray>- Chess War"
  help-admin-lines:
    - "<red>/chess event <start|stop|set|setspawn> <gray>- manage Chess War"
    - "<red>/chess give <player> <item> <gray>- trader, ability_wand, grandmaster_mace, chess_grandmaster, remnant, chess_clock"
    - "<red>/chess announce [-t color] [-s color] [-d sec] <title> | <subtitle> <gray>- screen announcement"
    - "<red>/chess meteor <spawn [random]|villager> <gray>- meteor with the shop villager"
    - "<red>/chess admin ... <gray>- setpiece, reset, setpoints, addpoints, clearcooldowns, setcooldown, setduration, setstat"
    - "<red>/chess reload"
  # --- pieces
  piece-changed: "<green>You are now a <piece><green>."
  choose-hint: "<gray>Pick your piece with <white>/chess choose<gray> - see what each one does with <white>/chessinfo<gray>."
  choose-invalid: "<red>Unknown piece. Choose one of: pawn, knight, bishop, rook, queen, king."
  choose-disabled: "<red>Choosing pieces is disabled."
  choose-same: "<red>You already are that piece."
  choose-blocked-event: "<red>During Chess War you can only change piece with the Piece Trader."
  choose-blocked-combat: "<red>You cannot change piece while in combat."
  choose-cooldown: "<red>You can change piece again in <white><time><red>."
